<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rate Your Service — That's Done Right</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#2e7d32;--green-dark:#1b5e20;--green-tint:#e8f5e9;
  --dark:#1c1c1c;--text-mid:#666;--text-lite:#999;
  --white:#fff;--off-white:#faf9f7;--border:#e8e2dc;
  --display:'Oswald',sans-serif;--body:'Source Sans 3',sans-serif;--script:'Pacifico',cursive;--radius:10px;
}
body{font-family:var(--body);background:var(--off-white);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;}
nav{background:var(--dark);padding:0 1.5rem;height:62px;display:flex;align-items:center;}
.nav-logo{font-family:var(--script);font-size:1.4rem;color:var(--green);}
.page{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;}
.card{background:var(--white);border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:2.5rem 2rem;max-width:420px;width:100%;text-align:center;}
.logo-mark{font-family:var(--script);font-size:2rem;color:var(--green);margin-bottom:.25rem;}
.card-title{font-family:var(--display);font-size:1.1rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--dark);margin-bottom:.4rem;}
.card-sub{font-size:.88rem;color:var(--text-mid);margin-bottom:1.75rem;line-height:1.5;}
.stars{display:flex;justify-content:center;gap:.5rem;margin-bottom:.5rem;}
.star{font-size:2.8rem;background:none;border:none;cursor:pointer;color:#ddd;line-height:1;transition:color .1s;padding:0 .1rem;}
.star.lit{color:#f9a825;}
.star:hover{color:#f9a825;}
.rating-label{font-family:var(--display);font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-lite);height:1.2rem;margin-bottom:1.5rem;}
.btn{width:100%;padding:.9rem;background:var(--green);color:var(--white);border:none;border-radius:var(--radius);font-family:var(--display);font-size:.9rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background .15s;}
.btn:hover{background:var(--green-dark);}
.btn:disabled{background:#ccc;cursor:default;}
.success{display:none;background:var(--green-tint);border:1px solid #c8e6c9;border-radius:var(--radius);padding:1.5rem;margin-top:1rem;}
.success-icon{font-size:2.5rem;margin-bottom:.5rem;}
.success-title{font-family:var(--display);font-size:1rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--green);margin-bottom:.4rem;}
.success-sub{font-size:.85rem;color:var(--green-dark);}
.already{display:none;color:var(--text-mid);font-size:.88rem;margin-top:1rem;}
.error{display:none;color:#c62828;font-size:.85rem;margin-top:.75rem;}
</style>
</head>
<body>

<nav>
  <div class="nav-logo">That's Done Right</div>
</nav>

<div class="page">
  <div class="card">
    <div class="logo-mark">★</div>
    <div class="card-title">How was your service?</div>
    <div class="card-sub" id="jobDesc">Rate your recent lawn visit below.</div>

    <div id="ratingForm">
      <div class="stars" id="stars">
        <button class="star" data-val="1" onclick="selectStar(1)">★</button>
        <button class="star" data-val="2" onclick="selectStar(2)">★</button>
        <button class="star" data-val="3" onclick="selectStar(3)">★</button>
        <button class="star" data-val="4" onclick="selectStar(4)">★</button>
        <button class="star" data-val="5" onclick="selectStar(5)">★</button>
      </div>
      <div class="rating-label" id="ratingLabel"> </div>
      <button class="btn" id="submitBtn" onclick="submitRating()" disabled>Submit Rating</button>
      <div class="error" id="errorMsg">Something went wrong. Please try again.</div>
    </div>

    <div class="success" id="successBox">
      <div class="success-icon">🌿</div>
      <div class="success-title">Thanks for your feedback!</div>
      <div class="success-sub">Your rating helps us keep improving.</div>
    </div>

    <div class="already" id="alreadyRated">You've already rated this visit — thank you!</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://djigwfatupycyfozivuu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqaWd3ZmF0dXB5Y3lmb3ppdnV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwODY2ODEsImV4cCI6MjA4ODY2MjY4MX0.0uXHYTscK4VlX5pFcdR-mfmdMEyoxJocsT_xyAbls4M";

const params       = new URLSearchParams(location.search);
const leadId       = parseInt(params.get('lead_id'))     || null;
const contractorId = parseInt(params.get('contractor_id')) || null;

const LABELS = ['','Needs work','Below average','Good','Great','Outstanding!'];
let selected = 0;

function selectStar(n) {
  selected = n;
  document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('lit', i < n));
  document.getElementById('ratingLabel').textContent = LABELS[n];
  document.getElementById('submitBtn').disabled = false;
}

document.querySelectorAll('.star').forEach(s => {
  const n = parseInt(s.dataset.val);
  s.addEventListener('mouseover', () => {
    document.querySelectorAll('.star').forEach((x, i) => x.classList.toggle('lit', i < n));
    document.getElementById('ratingLabel').textContent = LABELS[n];
  });
  s.addEventListener('mouseout', () => {
    document.querySelectorAll('.star').forEach((x, i) => x.classList.toggle('lit', i < selected));
    document.getElementById('ratingLabel').textContent = selected ? LABELS[selected] : ' ';
  });
});

async function init() {
  if (!leadId) return;

  // Show job address if we can fetch it
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}&select=address,scheduled_date`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const [lead] = await r.json();
    if (lead) {
      const date = lead.scheduled_date
        ? new Date(lead.scheduled_date + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
        : 'your recent visit';
      document.getElementById('jobDesc').textContent =
        `${lead.address ? lead.address + ' · ' : ''}${date}`;
    }
  } catch(e) {}

  // Check if already rated
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/lawn_service_reviews?lead_id=eq.${leadId}&select=id&limit=1`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await r.json();
    if (rows.length) {
      document.getElementById('ratingForm').style.display = 'none';
      document.getElementById('alreadyRated').style.display = 'block';
    }
  } catch(e) {}
}

async function submitRating() {
  if (!selected || !leadId) return;

  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Saving...';
  btn.disabled = true;
  document.getElementById('errorMsg').style.display = 'none';

  try {
    // Save the review
    const payload = { lead_id: leadId, rating: selected };
    if (contractorId) payload.contractor_id = contractorId;

    const r = await fetch(`${SUPABASE_URL}/rest/v1/lawn_service_reviews`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify(payload)
    });

    if (!r.ok) throw new Error('Save failed');

    // Update contractor's avg_rating and review_count
    if (contractorId) {
      await updateContractorRating(contractorId);
    }

    document.getElementById('ratingForm').style.display = 'none';
    document.getElementById('successBox').style.display = 'block';
  } catch(e) {
    console.error('Rating error:', e);
    document.getElementById('errorMsg').style.display = 'block';
    btn.textContent = 'Submit Rating';
    btn.disabled = false;
  }
}

async function updateContractorRating(cid) {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/lawn_service_reviews?contractor_id=eq.${cid}&select=rating`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const reviews = await r.json();
    if (!reviews.length) return;
    const avg = reviews.reduce((s, x) => s + x.rating, 0) / reviews.length;
    await fetch(`${SUPABASE_URL}/rest/v1/contractors?id=eq.${cid}`, {
      method: 'PATCH',
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ avg_rating: Math.round(avg * 100) / 100, review_count: reviews.length })
    });
  } catch(e) { console.error('Contractor rating update error:', e); }
}

init();
</script>
</body>
</html>
