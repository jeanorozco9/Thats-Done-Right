<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>That's Done Right — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:     #2e7d32;
  --green-mid: #43a047;
  --green-tint:#e8f5e9;
  --dark:      #1c1c1c;
  --dark-mid:  #3a3a3a;
  --text-mid:  #666;
  --text-lite: #999;
  --white:     #fff;
  --off-white: #faf9f7;
  --border:    #e8e2dc;
  --red:       #c62828;
  --display:   'Oswald', sans-serif;
  --body:      'Source Sans 3', sans-serif;
}

body { font-family: var(--body); background: var(--off-white); color: var(--dark); min-height: 100vh; }

/* LOGIN */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--dark);
}

.login-card {
  background: var(--white);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  text-align: center;
}

.login-logo {
  font-family: 'Pacifico', cursive;
  font-size: 1.8rem;
  color: var(--green);
  margin-bottom: .25rem;
}

.login-sub {
  font-family: var(--display);
  font-size: .65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-lite);
  margin-bottom: 2rem;
}

.login-card input {
  width: 100%;
  padding: .75rem 1rem;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: .95rem;
  font-family: var(--body);
  margin-bottom: .75rem;
  outline: none;
  text-align: center;
  letter-spacing: 3px;
}

.login-card input:focus { border-color: var(--green); }

.login-btn {
  width: 100%;
  padding: .8rem;
  background: var(--green);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-family: var(--display);
  font-size: .9rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}

.login-btn:hover { background: #1b5e20; }
.login-error { color: var(--red); font-size: .8rem; margin-top: .5rem; display: none; }

/* DASHBOARD */
#dashboard { display: none; }

nav {
  background: var(--dark);
  padding: 0 1.5rem;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-title {
  font-family: var(--display);
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--white);
}

.nav-title span { color: var(--green); }

.nav-actions { display: flex; gap: .75rem; align-items: center; }

.btn-sm {
  font-family: var(--display);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: .4rem .9rem;
  border-radius: 6px;
  cursor: pointer;
  border: none;
}

.btn-export { background: var(--green); color: var(--white); }
.btn-export:hover { background: #1b5e20; }
.btn-logout  { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
.btn-logout:hover { background: rgba(255,255,255,0.15); color: var(--white); }

/* STATS */
.stats-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 1.25rem 1.5rem;
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
}

.stat-num {
  font-family: var(--display);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--dark);
  line-height: 1;
}

.stat-num.green { color: var(--green); }

.stat-label {
  font-family: var(--display);
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-lite);
  margin-top: 2px;
}

/* TABLE */
.table-wrap {
  padding: 1.5rem;
  overflow-x: auto;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: .75rem;
}

.table-title {
  font-family: var(--display);
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--dark);
}

.filter-row { display: flex; gap: .5rem; flex-wrap: wrap; }

.filter-btn {
  font-family: var(--display);
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: .3rem .75rem;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-mid);
  cursor: pointer;
}

.filter-btn.active { background: var(--green); color: var(--white); border-color: var(--green); }

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  font-size: .85rem;
}

thead {
  background: var(--dark);
}

th {
  font-family: var(--display);
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  padding: .75rem 1rem;
  text-align: left;
  white-space: nowrap;
}

td {
  padding: .85rem 1rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--dark);
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--off-white); }

.badge {
  display: inline-block;
  font-family: var(--display);
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: .2rem .6rem;
  border-radius: 100px;
}

.badge-started  { background: #fff3e0; color: #e65100; }
.badge-booked        { background: var(--green-tint); color: var(--green); }
.badge-rescheduled   { background: var(--green-tint); color: var(--green); }
.badge-weekly   { background: #e3f2fd; color: #1565c0; }
.badge-twice    { background: #f3e5f5; color: #6a1b9a; }
.badge-once     { background: #fce4ec; color: #880e4f; }
.badge-invoiced { background: #e3f2fd; color: #0d47a1; }
.badge-completed{ background: #e8f5e9; color: #1b5e20; }
.badge-paid           { background: #1b5e20; color: #fff; }
.badge-cancelled      { background: #ffebee; color: #c62828; }
.badge-payment-failed { background: #fce4ec; color: #880e4f; }

.price-cell {
  font-family: var(--display);
  font-weight: 700;
  color: var(--green);
  font-size: .95rem;
}

.date-cell { color: var(--text-mid); font-size: .8rem; }

.empty-state {
  text-align: center;
  padding: 3rem;
  color: var(--text-lite);
}

.empty-state-icon { font-size: 2rem; margin-bottom: .5rem; }
.empty-state-msg { font-family: var(--display); font-size: .8rem; letter-spacing: 1px; text-transform: uppercase; }

.loading-state {
  text-align: center;
  padding: 3rem;
  color: var(--text-mid);
  font-size: .9rem;
}

.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin-right: .5rem;
  vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }

.refresh-btn {
  font-family: var(--display);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--green);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.refresh-btn:hover { text-decoration: underline; }

.contractor-select {
  font-family: var(--display);
  font-size: .65rem;
  font-weight: 600;
  letter-spacing: .5px;
  padding: .3rem .5rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  color: var(--dark);
  cursor: pointer;
  width: 100%;
  min-width: 120px;
}

.contractor-select:focus { outline: none; border-color: var(--green); }
.contractor-select.assigned { border-color: var(--green); color: var(--green); }

.badge-dispute-pending { background: #fff3e0; color: #e65100; }
.badge-dispute-solved  { background: var(--green-tint); color: var(--green); }
.disputes-tab-wrap { position: relative; display: inline-flex; }
.dispute-count { position: absolute; top: -6px; right: -6px; background: #c62828; color: #fff; font-family: var(--display); font-size: .55rem; font-weight: 700; border-radius: 100px; padding: .1rem .35rem; line-height: 1.4; }

@media (max-width: 600px) {
  .stats-bar { gap: 1rem; }
  .table-wrap { padding: 1rem .75rem; }
  th, td { padding: .65rem .75rem; }
}

/* LEAD DRAWER */
.drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 900;
}
.drawer-overlay.open { display: block; }

.lead-drawer {
  position: fixed;
  top: 0; right: 0;
  height: 100%;
  width: 380px;
  max-width: 100vw;
  background: var(--white);
  box-shadow: -4px 0 32px rgba(0,0,0,0.18);
  z-index: 901;
  transform: translateX(100%);
  transition: transform .25s ease;
  display: flex;
  flex-direction: column;
}
.lead-drawer.open { transform: translateX(0); }

.drawer-header {
  background: var(--dark);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-title {
  font-family: var(--display);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--white);
}
.drawer-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 1.4rem;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}
.drawer-close:hover { color: var(--white); }

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.drawer-section-label {
  font-family: var(--display);
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-lite);
  margin-bottom: .5rem;
}
.drawer-row {
  display: flex;
  flex-direction: column;
  gap: .15rem;
}
.drawer-value {
  font-size: .9rem;
  color: var(--dark);
  line-height: 1.5;
}
.drawer-value a { color: var(--green); text-decoration: none; }
.drawer-value.notes {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .75rem 1rem;
  font-size: .85rem;
  color: var(--dark-mid);
  white-space: pre-wrap;
  line-height: 1.6;
}
.drawer-divider { border: none; border-top: 1px solid var(--border); }

tr.clickable-row { cursor: pointer; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">That's Done Right</div>
    <div class="login-sub">Admin Dashboard</div>
    <input type="password" id="passInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Enter</button>
    <div class="login-error" id="loginError">Incorrect password</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav>
    <div class="nav-title"><span>That's Done Right</span> &nbsp;·&nbsp; Leads</div>
    <div class="nav-actions">
      <button class="btn-sm btn-export" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn-sm" id="specialTestBtn" onclick="sendSpecialTest()" style="background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:.4rem .9rem;font-size:.78rem;font-weight:600;cursor:pointer;">🧪 Test Promo (me only)</button>
      <button class="btn-sm" id="specialCampaignBtn" onclick="sendSpecialCampaign()" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:.4rem .9rem;font-size:.78rem;font-weight:600;cursor:pointer;">🌿 Send $19.99 Promo</button>
      <button class="btn-sm btn-logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-num green" id="statTotal">—</div>
      <div class="stat-label">Total Leads</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statBooked">—</div>
      <div class="stat-label">Booked</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statRevenue">—</div>
      <div class="stat-label">Est. Monthly Revenue</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statAvg">—</div>
      <div class="stat-label">Avg Price / Visit</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statDisputes" style="color:#c62828;">—</div>
      <div class="stat-label">Open Disputes</div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <div style="display:flex;align-items:center;gap:1rem;">
        <div class="table-title" id="tableTitle">All Leads</div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadLeads()">↻ Refresh</button>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" id="filterAll" onclick="showLeads(this)">All</button>
        <button class="filter-btn" onclick="setFilter('clients', this)">Clients</button>
        <button class="filter-btn" onclick="setFilter('started', this)">Leads</button>
        <button class="filter-btn" onclick="setFilter('booked', this)">Booked</button>
        <button class="filter-btn" onclick="setFilter('payment_failed', this)" style="border-color:#880e4f;color:#880e4f;">⚠ Failed Payments</button>
        <button class="filter-btn" onclick="setFilter('cancelled', this)" style="border-color:#c62828;color:#c62828;">Cancelled</button>
        <button class="filter-btn" id="contractorsTab" onclick="showContractors(this)" style="margin-left:.5rem;border-color:#1c1c1c;color:#1c1c1c;font-weight:700;">🌿 Contractors</button>
        <div class="disputes-tab-wrap">
          <button class="filter-btn" id="disputesTab" onclick="showDisputes(this)" style="margin-left:.25rem;border-color:#c62828;color:#c62828;font-weight:700;">⚑ Disputes</button>
          <span class="dispute-count" id="disputeTabCount" style="display:none;">0</span>
        </div>
        <button class="filter-btn" id="invoicesTab" onclick="showInvoices(this)" style="margin-left:.25rem;border-color:#1565c0;color:#1565c0;font-weight:700;">🧾 Invoices</button>
      </div>
    </div>

    <div id="tableContainer">
      <div class="loading-state"><span class="spinner"></span> Loading leads...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://djigwfatupycyfozivuu.supabase.co";
const FUNCTION_URL          = "https://djigwfatupycyfozivuu.supabase.co/functions/v1/send-invoice";
const NOTIFY_CONTRACTOR_URL = "https://djigwfatupycyfozivuu.supabase.co/functions/v1/notify-contractor";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqaWd3ZmF0dXB5Y3lmb3ppdnV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwODY2ODEsImV4cCI6MjA4ODY2MjY4MX0.0uXHYTscK4VlX5pFcdR-mfmdMEyoxJocsT_xyAbls4M";
const ADMIN_PASS = "kike";

// Loaded dynamically from Supabase contractors table
let CONTRACTORS = [{ id: 0, name: "Unassigned" }];

let allLeads = [];
let currentFilter = 'all';

async function login() {
  const pass = document.getElementById('passInput').value;
  if (pass === ADMIN_PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadContractors();
    await loadLeads();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('passInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}

async function loadContractors() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/contractors?status=eq.approved&select=id,name&order=name.asc',
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
    );
    const data = await res.json();
    if (data && data.length) {
      CONTRACTORS = [{ id: 0, name: "Unassigned" }, ...data];
    }
  } catch(e) {
    console.error('Load contractors error:', e);
  }
}

async function loadLeads() {
  document.getElementById('tableContainer').innerHTML =
    '<div class="loading-state"><span class="spinner"></span> Loading leads...</div>';

  try {
    // Make sure contractors are loaded first
    if (CONTRACTORS.length <= 1) await loadContractors();

    const res = await fetch(
      SUPABASE_URL + '/rest/v1/leads?select=*&order=created_at.desc',
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
    );
    allLeads = await res.json();
    updateStats();
    renderTable();
  } catch(e) {
    document.getElementById('tableContainer').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-msg">Failed to load leads</div></div>';
  }
}

function updateStats() {
  const total    = allLeads.length;
  const booked   = allLeads.filter(l => l.status === 'booked' || l.status === 'rescheduled').length;
  const prices   = allLeads.filter(l => l.price > 0).map(l => l.price);
  const avg      = prices.length ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : 0;
  const ACTIVE = ['booked', 'rescheduled', 'completed', 'invoiced', 'paid'];
  const monthly = allLeads
    .filter(l => ACTIVE.includes(l.status) && l.price > 0 && l.frequency !== 'once')
    .reduce((sum, l) => {
      const mult = l.frequency === 'weekly' ? 4 : 2;
      return sum + (l.price * mult);
    }, 0);

  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statBooked').textContent   = booked;
  document.getElementById('statRevenue').textContent  = monthly ? '$' + monthly.toLocaleString() : '—';
  document.getElementById('statAvg').textContent      = avg ? '$' + avg : '—';
  // Dispute count is updated when disputes tab is loaded
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const leads = currentFilter === 'all'
    ? allLeads
    : currentFilter === 'clients'
      ? allLeads.filter(l => l.status === 'booked' || l.status === 'rescheduled' || l.status === 'completed' || l.status === 'invoiced')
      : allLeads.filter(l => l.status === currentFilter || (currentFilter === 'booked' && (l.status === 'invoiced' || l.status === 'rescheduled')));

  const filterLabel = currentFilter === 'all' ? 'All' : currentFilter === 'clients' ? 'Clients' : currentFilter === 'started' ? 'Leads' : currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
  document.getElementById('tableTitle').textContent = filterLabel;

  if (!leads.length) {
    document.getElementById('tableContainer').innerHTML =
      `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-msg">No ${filterLabel.toLowerCase()} yet</div></div>`;
    return;
  }

  const rows = leads.map(l => {
    const date = l.created_at
      ? new Date(l.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
      : '—';
    const freqBadge = l.frequency === 'weekly' ? 'badge-weekly'
                    : l.frequency === 'twice'  ? 'badge-twice'
                    : 'badge-once';
    const freqLabel = l.frequency === 'weekly' ? 'Weekly'
                    : l.frequency === 'twice'  ? 'Twice/Mo'
                    : 'Once/Mo';
    const statusBadge = l.status === 'booked'          ? 'badge-booked'
                      : l.status === 'rescheduled'    ? 'badge-booked'
                      : l.status === 'invoiced'       ? 'badge-invoiced'
                      : l.status === 'completed'      ? 'badge-completed'
                      : l.status === 'paid'           ? 'badge-paid'
                      : l.status === 'cancelled'      ? 'badge-cancelled'
                      : l.status === 'payment_failed' ? 'badge-payment-failed'
                      : 'badge-started';
    const statusLabel = l.status === 'booked'          ? 'Booked'
                      : l.status === 'rescheduled'    ? 'Rescheduled'
                      : l.status === 'invoiced'       ? 'Invoiced'
                      : l.status === 'completed'      ? 'Completed'
                      : l.status === 'paid'           ? '💰 Paid'
                      : l.status === 'cancelled'      ? 'Cancelled'
                      : l.status === 'payment_failed' ? 'Needs Payment'
                      : 'Pending';

    const invoiceBtn = (['booked', 'completed', 'rescheduled', 'payment_failed'].includes(l.status))

async function assignContractor(leadId, contractorId) {
  try {
    const cid = parseInt(contractorId);
    console.log('Assigning contractor:', cid, 'to lead:', leadId);
    // Store null for unassigned, real id for assigned
    const updates = { contractor_id: cid > 0 ? cid : null };

    // If assigning a real contractor, flip status to booked
    if (cid > 0) {
      const lead = allLeads.find(l => l.id === leadId);
      if (lead && lead.status === 'started') {
        updates.status = 'booked';
      }
    }

    const res = await fetch(SUPABASE_URL + '/rest/v1/leads?id=eq.' + leadId, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(updates)
    });
    console.log('Patch status:', res.status, 'updates sent:', JSON.stringify(updates));

    // Notify contractor of new job offer
    if (cid > 0) {
      try {
        await fetch(NOTIFY_CONTRACTOR_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lead_id: leadId, contractor_id: cid })
        });
      } catch(notifyErr) {
        console.error('Notify contractor error (assignment still saved):', notifyErr);
      }
    }

    // Update local allLeads array directly — no need to refetch
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) {
      lead.contractor_id = cid > 0 ? cid : null;
      if (updates.status) lead.status = updates.status;
    }

    renderTable();
  } catch(e) {
    console.error('Assign contractor error:', e);
  }
}

async function sendInvoice(leadId) {
  // Always fetch fresh from DB to verify first_mow_promo status — never trust cache alone
  const freshRes = await fetch(
    `${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}&select=id,name,price,first_mow_promo`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
  );
  const [freshLead] = await freshRes.json();
  if (!freshLead) { alert('Could not load lead data.'); return; }

  const hasPromo  = !!freshLead.first_mow_promo;
  const origPrice = freshLead.price || 0;
  const PROMO_AMT = 20; // $19.99 advertised, billed as $20 (int column)

  const msg = hasPromo
    ? `This customer has the $19.99 first mow promo.\n\nThey will be invoiced for $${PROMO_AMT} (promo rate).\nAfter this invoice their account reverts to $${origPrice}/visit.\n\nSend invoice?`
    : 'Send invoice to this customer?';

  if (!confirm(msg)) return;

  try {
    // Pass amount_override when promo is active — edge function uses it instead of lead.price
    const payload = hasPromo
      ? { lead_id: leadId, amount_override: PROMO_AMT }
      : { lead_id: leadId };

    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    const currentLead = allLeads.find(l => l.id === leadId);
    if (data.ok) {
      // If this was a failed-payment retry, flip back to rescheduled
      if (currentLead && currentLead.status === 'payment_failed') {
        await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
          body: JSON.stringify({ status: 'rescheduled' })
        });
        if (currentLead) currentLead.status = 'rescheduled';
      }
      if (hasPromo) {
        // Clear promo flag only — original price was never touched in DB
        await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
          body: JSON.stringify({ first_mow_promo: false })
        });
        if (currentLead) currentLead.first_mow_promo = false;
      }
      alert('Invoice sent! ' + (hasPromo ? `Charged $${PROMO_AMT} (promo). Account reverted to $${origPrice}/visit.` : ''));
      loadLeads();
    } else {
      // Payment failed — mark the lead so admin can see it
      if (currentLead && ['booked', 'rescheduled', 'completed'].includes(currentLead.status)) {
        await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
          body: JSON.stringify({ status: 'payment_failed' })
        });
        if (currentLead) currentLead.status = 'payment_failed';
        renderTable();
      }
      alert('Payment failed: ' + (data.error || 'Unknown error') + '\n\nThis client has been flagged as Needs Payment.');
    }
  } catch(e) {
    alert('Failed to send invoice: ' + e.message);
  }
}

function exportCSV() {
  if (!allLeads.length) return;
  const headers = ['Date','Name','Email','Phone','Address','Zip','Frequency','Price','Status'];
  const rows = allLeads.map(l => [
    l.created_at ? new Date(l.created_at).toLocaleDateString() : '',
    l.name || '', l.email || '', l.phone || '',
    l.address || '', l.zip || '', l.frequency || '',
    l.price || '', l.status || ''
  ].map(v => `"${v}"`).join(','));

  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tdr-leads-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function adminPreviewPhoto() {
  const input = document.getElementById('adminPhotoInput');
  const preview = document.getElementById('adminPhotoPreview');
  const btn = document.getElementById('adminSubmitBtn');
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    btn.style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

async function adminSubmitPhoto(leadId) {
  const input = document.getElementById('adminPhotoInput');
  const btn   = document.getElementById('adminSubmitBtn');
  const msg   = document.getElementById('adminPhotoMsg');
  if (!input.files || !input.files[0]) return;

  btn.textContent = 'Uploading...';
  btn.disabled = true;
  msg.style.display = 'none';

  try {
    const file = input.files[0];
    const filename = `job-${leadId}-${Date.now()}.${file.name.split('.').pop()}`;

    // 1. Upload photo to Supabase Storage via REST API
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/job-photos/${filename}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': file.type
      },
      body: file
    });
    if (!uploadRes.ok) throw new Error('Photo upload failed');

    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/job-photos/${filename}`;

    // 2. Mark job completed with photo URL
    btn.textContent = 'Saving...';
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ status: 'completed', photo_url: publicUrl })
    });

    // 3. Send invoice & charge client
    btn.textContent = 'Charging client...';
    const invoiceRes = await fetch('https://djigwfatupycyfozivuu.supabase.co/functions/v1/send-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead_id: leadId })
    });
    if (!invoiceRes.ok) throw new Error('Invoice failed');

    // Update local cache
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) { lead.status = 'completed'; lead.photo_url = publicUrl; }

    // 4. Schedule next visit for recurring clients (background)
    adminScheduleNextVisit(leadId);

    msg.textContent = '✓ Job submitted and client charged';
    msg.style.color = 'var(--green)';
    msg.style.display = 'block';
    btn.textContent = '✅ Done';
  } catch(e) {
    console.error('Admin submit photo error:', e);
    msg.textContent = 'Error: ' + e.message;
    msg.style.color = '#c62828';
    msg.style.display = 'block';
    btn.textContent = '✅ Submit & Charge Client';
    btn.disabled = false;
  }
}

async function adminScheduleNextVisit(leadId) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}&select=frequency,scheduled_date`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const [job] = await res.json();
    if (!job || !job.scheduled_date) return;
    if (job.frequency !== 'weekly' && job.frequency !== 'twice') return;
    const days = job.frequency === 'weekly' ? 7 : 14;
    const next = new Date(job.scheduled_date + 'T12:00:00');
    next.setDate(next.getDate() + days);
    const nextDateStr = next.toISOString().split('T')[0];
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ scheduled_date: nextDateStr, status: 'rescheduled' })
    });
  } catch(e) {
    console.error('Admin schedule next visit error:', e);
  }
}

  btn.textContent = 'Saving...';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ first_mow_promo: false })
    });
    if (!res.ok) throw new Error('Failed');
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.first_mow_promo = false;
    btn.textContent = '✅ Done — reverted to regular rate';
    btn.style.background = '#6b7280';
    setTimeout(() => openLeadDrawer(leadId), 800);
  } catch {
    btn.textContent = 'Error — try again';
    btn.disabled = false;
  }
}

function closeLeadDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('leadDrawer').classList.remove('open');
}
</script>

<!-- LEAD DETAIL DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeLeadDrawer()"></div>
<div class="lead-drawer" id="leadDrawer">
  <div class="drawer-header">
    <span class="drawer-title">Client Details</span>
    <button class="drawer-close" onclick="closeLeadDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerContent"></div>
</div>

</body>
</html>
