<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>That's Done Right — Admin</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon.ico" sizes="32x32"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta name="apple-mobile-web-app-title" content="Done Right"/>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green:     #2e7d32;
  --green-mid: #43a047;
  --green-tint:#e8f5e9;
  --dark:      #1c1c1c;
  --dark-mid:  #3a3a3a;
  --text-mid:  #666;
  --text-lite: #999;
  --white:     #fff;
  --off-white: #faf9f7;
  --border:    #e8e2dc;
  --red:       #c62828;
  --script:    'Pacifico', cursive;
  --display:   'Helvetica Neue', Helvetica, Arial, sans-serif;
  --body:      'Helvetica Neue', Helvetica, Arial, sans-serif;
}

body { font-family: var(--body); background: var(--off-white); color: var(--dark); min-height: 100vh; }

/* LOGIN */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--dark);
}

.login-card {
  background: var(--white);
  border-radius: 16px;
  padding: 2.5rem 2rem;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  text-align: center;
}

.login-logo {
  font-family: 'Pacifico', cursive;
  font-size: 1.8rem;
  color: var(--green);
  margin-bottom: .25rem;
}

.login-sub {
  font-family: var(--display);
  font-size: .65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-lite);
  margin-bottom: 2rem;
}

.login-card input {
  width: 100%;
  padding: .75rem 1rem;
  border: 2px solid var(--border);
  border-radius: 8px;
  font-size: .95rem;
  font-family: var(--body);
  margin-bottom: .75rem;
  outline: none;
  text-align: center;
  letter-spacing: 3px;
}

.login-card input:focus { border-color: var(--green); }

.login-btn {
  width: 100%;
  padding: .8rem;
  background: var(--green);
  color: var(--white);
  border: none;
  border-radius: 8px;
  font-family: var(--display);
  font-size: .9rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
}

.login-btn:hover { background: #1b5e20; }
.login-error { color: var(--red); font-size: .8rem; margin-top: .5rem; display: none; }

/* DASHBOARD */
#dashboard { display: none; }

nav {
  background: var(--dark);
  padding: 0 1.5rem;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.nav-title {
  font-family: var(--display);
  font-size: .8rem;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--white);
}

.nav-title span { color: var(--green); font-family: var(--script); font-size: 1.35rem; font-weight: 400; letter-spacing: 0; text-transform: none; }

.nav-actions { display: flex; gap: .75rem; align-items: center; }

.btn-sm {
  font-family: var(--display);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: .4rem .9rem;
  border-radius: 6px;
  cursor: pointer;
  border: none;
}

.btn-export { background: var(--green); color: var(--white); }
.btn-export:hover { background: #1b5e20; }
.btn-logout  { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
.btn-logout:hover { background: rgba(255,255,255,0.15); color: var(--white); }

/* STATS */
.stats-bar {
  background: var(--white);
  border-bottom: 1px solid var(--border);
  padding: 1.25rem 1.5rem;
  display: flex;
  gap: 2rem;
  flex-wrap: wrap;
}

.stat {
  display: flex;
  flex-direction: column;
}

.stat-num {
  font-family: var(--display);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--dark);
  line-height: 1;
}

.stat-num.green { color: var(--green); }

.stat-label {
  font-family: var(--display);
  font-size: .6rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-lite);
  margin-top: 2px;
}

/* TABLE */
.table-wrap {
  padding: 1.5rem;
  overflow-x: auto;
}

.table-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
  flex-wrap: wrap;
  gap: .75rem;
}

.table-title {
  font-family: var(--display);
  font-size: .85rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--dark);
}

.filter-row { display: flex; gap: .5rem; flex-wrap: wrap; }

.filter-btn {
  font-family: var(--display);
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: .3rem .75rem;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--white);
  color: var(--text-mid);
  cursor: pointer;
}

.filter-btn.active { background: var(--green); color: var(--white); border-color: var(--green); }

table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 1px 8px rgba(0,0,0,0.06);
  font-size: .85rem;
}

thead {
  background: var(--dark);
}

th {
  font-family: var(--display);
  font-size: .62rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  padding: .75rem 1rem;
  text-align: left;
  white-space: nowrap;
}

td {
  padding: .85rem 1rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--dark);
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--off-white); }

.badge {
  display: inline-block;
  font-family: var(--display);
  font-size: .58rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: .2rem .6rem;
  border-radius: 100px;
}

.badge-started  { background: #fff3e0; color: #e65100; }
.badge-booked        { background: var(--green-tint); color: var(--green); }
.badge-rescheduled   { background: var(--green-tint); color: var(--green); }
.badge-weekly   { background: #e3f2fd; color: #1565c0; }
.badge-twice    { background: #f3e5f5; color: #6a1b9a; }
.badge-once     { background: #fce4ec; color: #880e4f; }
.badge-invoiced { background: #e3f2fd; color: #0d47a1; }
.badge-completed{ background: #e8f5e9; color: #1b5e20; }
.badge-paid           { background: #1b5e20; color: #fff; }
.badge-cancelled      { background: #ffebee; color: #c62828; }
.badge-payment-failed { background: #fce4ec; color: #880e4f; }

.price-cell {
  font-family: var(--display);
  font-weight: 700;
  color: var(--green);
  font-size: .95rem;
}

.date-cell { color: var(--text-mid); font-size: .8rem; }

.empty-state {
  text-align: center;
  padding: 3rem;
  color: var(--text-lite);
}

.empty-state-icon { font-size: 2rem; margin-bottom: .5rem; }
.empty-state-msg { font-family: var(--display); font-size: .8rem; letter-spacing: 1px; text-transform: uppercase; }

.loading-state {
  text-align: center;
  padding: 3rem;
  color: var(--text-mid);
  font-size: .9rem;
}

.spinner {
  display: inline-block;
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin-right: .5rem;
  vertical-align: middle;
}

@keyframes spin { to { transform: rotate(360deg); } }

.refresh-btn {
  font-family: var(--display);
  font-size: .7rem;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--green);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

.refresh-btn:hover { text-decoration: underline; }

.contractor-select {
  font-family: var(--display);
  font-size: .65rem;
  font-weight: 600;
  letter-spacing: .5px;
  padding: .3rem .5rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--white);
  color: var(--dark);
  cursor: pointer;
  width: 100%;
  min-width: 120px;
}

.contractor-select:focus { outline: none; border-color: var(--green); }
.contractor-select.assigned { border-color: var(--green); color: var(--green); }

.badge-dispute-pending { background: #fff3e0; color: #e65100; }
.badge-dispute-solved  { background: var(--green-tint); color: var(--green); }
.disputes-tab-wrap { position: relative; display: inline-flex; }
.dispute-count { position: absolute; top: -6px; right: -6px; background: #c62828; color: #fff; font-family: var(--display); font-size: .55rem; font-weight: 700; border-radius: 100px; padding: .1rem .35rem; line-height: 1.4; }

@media (max-width: 600px) {
  .stats-bar { gap: 1rem; }
  .table-wrap { padding: 1rem .75rem; }
  th, td { padding: .65rem .75rem; }
}

/* LEAD DRAWER */
.drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 900;
}
.drawer-overlay.open { display: block; }

.lead-drawer {
  position: fixed;
  top: 0; right: 0;
  height: 100%;
  width: 380px;
  max-width: 100vw;
  background: var(--white);
  box-shadow: -4px 0 32px rgba(0,0,0,0.18);
  z-index: 901;
  transform: translateX(100%);
  transition: transform .25s ease;
  display: flex;
  flex-direction: column;
}
.lead-drawer.open { transform: translateX(0); }

.drawer-header {
  background: var(--dark);
  padding: 1.25rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.drawer-title {
  font-family: var(--display);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--white);
}
.drawer-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.6);
  font-size: 1.4rem;
  cursor: pointer;
  line-height: 1;
  padding: 0;
}
.drawer-close:hover { color: var(--white); }

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.drawer-section-label {
  font-family: var(--display);
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-lite);
  margin-bottom: .5rem;
}
.drawer-row {
  display: flex;
  flex-direction: column;
  gap: .15rem;
}
.drawer-value {
  font-size: .9rem;
  color: var(--dark);
  line-height: 1.5;
}
.drawer-value a { color: var(--green); text-decoration: none; }
.drawer-value.notes {
  background: var(--off-white);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: .75rem 1rem;
  font-size: .85rem;
  color: var(--dark-mid);
  white-space: pre-wrap;
  line-height: 1.6;
}
.drawer-divider { border: none; border-top: 1px solid var(--border); }

tr.clickable-row { cursor: pointer; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">That's Done Right</div>
    <div class="login-sub">Admin Dashboard</div>
    <input type="password" id="passInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/>
    <button class="login-btn" onclick="login()">Enter</button>
    <div class="login-error" id="loginError">Incorrect password</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav>
    <div class="nav-title"><span>That's Done Right</span> &nbsp;·&nbsp; Leads</div>
    <div class="nav-actions">
      <button class="btn-sm btn-export" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn-sm" id="specialTestBtn" onclick="sendSpecialTest()" style="background:#f59e0b;color:#fff;border:none;border-radius:8px;padding:.4rem .9rem;font-size:.78rem;font-weight:600;cursor:pointer;">🧪 Test Promo (me only)</button>
      <button class="btn-sm" id="specialCampaignBtn" onclick="sendSpecialCampaign()" style="background:#16a34a;color:#fff;border:none;border-radius:8px;padding:.4rem .9rem;font-size:.78rem;font-weight:600;cursor:pointer;">🌿 Send $19.99 Promo</button>
      <button class="btn-sm btn-logout" onclick="logout()">Log Out</button>
    </div>
  </nav>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-num green" id="statTotal">—</div>
      <div class="stat-label">Total Leads</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statBooked">—</div>
      <div class="stat-label">Booked</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statRevenue">—</div>
      <div class="stat-label">Est. Monthly Revenue</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statAvg">—</div>
      <div class="stat-label">Avg Price / Visit</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statDisputes" style="color:#c62828;">—</div>
      <div class="stat-label">Open Disputes</div>
    </div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <div style="display:flex;align-items:center;gap:1rem;">
        <div class="table-title" id="tableTitle">All Leads</div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadLeads()">↻ Refresh</button>
      </div>
      <div class="filter-row">
        <button class="filter-btn active" id="filterAll" onclick="showLeads(this)">All</button>
        <button class="filter-btn" onclick="setFilter('clients', this)">Clients</button>
        <button class="filter-btn" onclick="setFilter('started', this)">Leads</button>
        <button class="filter-btn" onclick="setFilter('booked', this)">Booked</button>
        <button class="filter-btn" onclick="setFilter('payment_failed', this)" style="border-color:#880e4f;color:#880e4f;">⚠ Failed Payments</button>
        <button class="filter-btn" onclick="setFilter('cancelled', this)" style="border-color:#c62828;color:#c62828;">Cancelled</button>
        <button class="filter-btn" id="contractorsTab" onclick="showContractors(this)" style="margin-left:.5rem;border-color:#1c1c1c;color:#1c1c1c;font-weight:700;">🌿 Contractors</button>
        <div class="disputes-tab-wrap">
          <button class="filter-btn" id="disputesTab" onclick="showDisputes(this)" style="margin-left:.25rem;border-color:#c62828;color:#c62828;font-weight:700;">⚑ Disputes</button>
          <span class="dispute-count" id="disputeTabCount" style="display:none;">0</span>
        </div>
        <button class="filter-btn" id="invoicesTab" onclick="showInvoices(this)" style="margin-left:.25rem;border-color:#1565c0;color:#1565c0;font-weight:700;">🧾 Invoices</button>
        <button class="filter-btn" id="payContractorsTab" onclick="showPayContractors(this)" style="margin-left:.25rem;border-color:#6a1b9a;color:#6a1b9a;font-weight:700;">💸 Pay Contractors</button>
        <button class="filter-btn" id="scheduleViewTab" onclick="showContractorSchedule(this)" style="margin-left:.25rem;border-color:#00695c;color:#00695c;font-weight:700;">👷 Schedule View</button>
      </div>
    </div>

    <div id="tableContainer">
      <div class="loading-state"><span class="spinner"></span> Loading leads...</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://djigwfatupycyfozivuu.supabase.co";
const FUNCTION_URL              = "https://djigwfatupycyfozivuu.supabase.co/functions/v1/send-invoice";
const NOTIFY_CONTRACTOR_URL     = "https://djigwfatupycyfozivuu.supabase.co/functions/v1/notify-contractor";
const NOTIFY_PAYMENT_FAILED_URL = "https://djigwfatupycyfozivuu.supabase.co/functions/v1/notify-payment-failed";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqaWd3ZmF0dXB5Y3lmb3ppdnV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwODY2ODEsImV4cCI6MjA4ODY2MjY4MX0.0uXHYTscK4VlX5pFcdR-mfmdMEyoxJocsT_xyAbls4M";
const ADMIN_PASS = "kike";

// Loaded dynamically from Supabase contractors table
let CONTRACTORS = [{ id: 0, name: "Unassigned" }];

let allLeads = [];
let currentFilter = 'all';

async function login() {
  const pass = document.getElementById('passInput').value;
  if (pass === ADMIN_PASS) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadContractors();
    await loadLeads();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('passInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}

async function loadContractors() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/contractors?status=eq.approved&select=id,name&order=name.asc',
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
    );
    const data = await res.json();
    if (data && data.length) {
      CONTRACTORS = [{ id: 0, name: "Unassigned" }, ...data];
    }
  } catch(e) {
    console.error('Load contractors error:', e);
  }
}

async function loadLeads() {
  document.getElementById('tableContainer').innerHTML =
    '<div class="loading-state"><span class="spinner"></span> Loading leads...</div>';

  try {
    // Make sure contractors are loaded first
    if (CONTRACTORS.length <= 1) await loadContractors();

    const res = await fetch(
      SUPABASE_URL + '/rest/v1/leads?select=*&order=created_at.desc',
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }
    );
    allLeads = await res.json();
    updateStats();
    renderTable();
  } catch(e) {
    document.getElementById('tableContainer').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-msg">Failed to load leads</div></div>';
  }
}

function updateStats() {
  const total    = allLeads.length;
  const booked   = allLeads.filter(l => l.status === 'booked' || l.status === 'rescheduled').length;
  const prices   = allLeads.filter(l => l.price > 0).map(l => l.price);
  const avg      = prices.length ? Math.round(prices.reduce((a,b)=>a+b,0)/prices.length) : 0;
  const ACTIVE = ['booked', 'rescheduled', 'completed', 'invoiced', 'paid'];
  const monthly = allLeads
    .filter(l => ACTIVE.includes(l.status) && l.price > 0 && l.frequency !== 'once')
    .reduce((sum, l) => {
      const mult = l.frequency === 'weekly' ? 4 : 2;
      return sum + (l.price * mult);
    }, 0);

  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statBooked').textContent   = booked;
  document.getElementById('statRevenue').textContent  = monthly ? '$' + monthly.toLocaleString() : '—';
  document.getElementById('statAvg').textContent      = avg ? '$' + avg : '—';
  // Dispute count is updated when disputes tab is loaded
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function renderTable() {
  const leads = currentFilter === 'all'
    ? allLeads
    : currentFilter === 'clients'
      ? allLeads.filter(l => l.status === 'booked' || l.status === 'rescheduled' || l.status === 'completed' || l.status === 'invoiced')
      : allLeads.filter(l => l.status === currentFilter || (currentFilter === 'booked' && (l.status === 'invoiced' || l.status === 'rescheduled')));

  const filterLabel = currentFilter === 'all' ? 'All' : currentFilter === 'clients' ? 'Clients' : currentFilter === 'started' ? 'Leads' : currentFilter.charAt(0).toUpperCase() + currentFilter.slice(1);
  document.getElementById('tableTitle').textContent = filterLabel;

  if (!leads.length) {
    document.getElementById('tableContainer').innerHTML =
      `<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-msg">No ${filterLabel.toLowerCase()} yet</div></div>`;
    return;
  }

  const rows = leads.map(l => {
    const date = l.created_at
      ? new Date(l.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
      : '—';
    const freqBadge = l.frequency === 'weekly' ? 'badge-weekly'
                    : l.frequency === 'twice'  ? 'badge-twice'
                    : 'badge-once';
    const freqLabel = l.frequency === 'weekly' ? 'Weekly'
                    : l.frequency === 'twice'  ? 'Twice/Mo'
                    : 'Once/Mo';
    const statusBadge = l.status === 'booked'          ? 'badge-booked'
                      : l.status === 'rescheduled'    ? 'badge-booked'
                      : l.status === 'invoiced'       ? 'badge-invoiced'
                      : l.status === 'completed'      ? 'badge-completed'
                      : l.status === 'paid'           ? 'badge-paid'
                      : l.status === 'cancelled'      ? 'badge-cancelled'

async function assignContractor(leadId, contractorId) {
  try {
    const cid = parseInt(contractorId);
    console.log('Assigning contractor:', cid, 'to lead:', leadId);
    // Store null for unassigned, real id for assigned
    const updates = { contractor_id: cid > 0 ? cid : null };

    // If assigning a real contractor, flip status to booked
    if (cid > 0) {
      const lead = allLeads.find(l => l.id === leadId);
      if (lead && lead.status === 'started') {
        updates.status = 'booked';
      }
    }

    const res = await fetch(SUPABASE_URL + '/rest/v1/leads?id=eq.' + leadId, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(updates)
    });
    console.log('Patch status:', res.status, 'updates sent:', JSON.stringify(updates));

    // Notify contractor of new job offer
    if (cid > 0) {
      try {
        await fetch(NOTIFY_CONTRACTOR_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lead_id: leadId, contractor_id: cid })
        });
      } catch(notifyErr) {
        console.error('Notify contractor error (assignment still saved):', notifyErr);
      }
    }

    // Update local allLeads array directly — no need to refetch
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) {
      lead.contractor_id = cid > 0 ? cid : null;
      if (updates.status) lead.status = updates.status;
    }

    renderTable();
  } catch(e) {
    console.error('Assign contractor error:', e);
  }
}

async function sendInvoice(leadId) {
  // Always fetch fresh from DB to verify first_mow_promo status — never trust cache alone
  const freshRes = await fetch(
    `${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}&select=id,name,price,first_mow_promo`,
    { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
  );
  const [freshLead] = await freshRes.json();
  if (!freshLead) { alert('Could not load lead data.'); return; }

  const hasPromo  = !!freshLead.first_mow_promo;
  const origPrice = freshLead.price || 0;
  const PROMO_AMT = 20; // $19.99 advertised, billed as $20 (int column)

  const msg = hasPromo
    ? `This customer has the $19.99 first mow promo.\n\nThey will be invoiced for $${PROMO_AMT} (promo rate).\nAfter this invoice their account reverts to $${origPrice}/visit.\n\nSend invoice?`
    : 'Send invoice to this customer?';

  if (!confirm(msg)) return;

  try {
    // Pass amount_override when promo is active — edge function uses it instead of lead.price
    const payload = hasPromo
      ? { lead_id: leadId, amount_override: PROMO_AMT }
      : { lead_id: leadId };

    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_KEY },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    const currentLead = allLeads.find(l => l.id === leadId);
    if (data.ok) {
      // If this was a failed-payment retry, flip back to rescheduled
      if (currentLead && currentLead.status === 'payment_failed') {
        await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
          body: JSON.stringify({ status: 'rescheduled' })
        });
        if (currentLead) currentLead.status = 'rescheduled';
      }
      if (hasPromo) {
        // Clear promo flag only — original price was never touched in DB
        await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
          body: JSON.stringify({ first_mow_promo: false })
        });
        if (currentLead) currentLead.first_mow_promo = false;
      }
      alert('Invoice sent! ' + (hasPromo ? `Charged $${PROMO_AMT} (promo). Account reverted to $${origPrice}/visit.` : ''));
      loadLeads();
    } else {
      // Payment failed — mark the lead so admin can see it
      if (currentLead && ['booked', 'rescheduled', 'completed'].includes(currentLead.status)) {
        await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
          body: JSON.stringify({ status: 'payment_failed' })
        });
        if (currentLead) currentLead.status = 'payment_failed';
        renderTable();
        // Alert the team via email
        fetch(NOTIFY_PAYMENT_FAILED_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${SUPABASE_KEY}` },
          body: JSON.stringify({
            lead_id: leadId,
            name: currentLead.name,
            email: currentLead.email,
            address: currentLead.address,
            amount: currentLead.price
          })
        }).catch(() => {}); // fire-and-forget
      }
      alert('Payment failed: ' + (data.error || 'Unknown error') + '\n\nThis client has been flagged as Needs Payment.');
    }
  } catch(e) {
    alert('Failed to send invoice: ' + e.message);
  }
}

      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-msg">Failed to load invoices</div></div>';
  }
}

async function showPayContractors(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tableTitle').textContent = 'Pay Contractors';
  document.getElementById('refreshBtn').onclick = () => showPayContractors(btn);

  document.getElementById('tableContainer').innerHTML =
    '<div class="loading-state"><span class="spinner"></span> Loading...</div>';

  try {
    // Fetch all completed jobs that have a contractor assigned and a vendor_pay amount
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/leads?contractor_id=not.is.null&vendor_pay=gt.0&status=in.(completed,paid,invoiced,rescheduled,cancelled)&select=id,address,scheduled_date,name,vendor_pay,contractor_paid,contractor_id&order=contractor_id.asc,scheduled_date.desc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const jobs = await res.json();

    // Also fetch contractor names
    const cRes = await fetch(
      `${SUPABASE_URL}/rest/v1/contractors?select=id,name`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    const contractors = await cRes.json();
    const cMap = Object.fromEntries((Array.isArray(contractors) ? contractors : []).map(c => [c.id, c.name]));

    if (!jobs.length) {
      document.getElementById('tableContainer').innerHTML =
        '<div class="empty-state"><div class="empty-state-icon">💸</div><div class="empty-state-msg">No contractor payments on record</div></div>';
      return;
    }

    const unpaid = jobs.filter(j => !j.contractor_paid);
    const totalOwed = unpaid.reduce((s, j) => s + (j.vendor_pay || 0), 0);

    const summaryBar = `
      <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;padding:.75rem 1rem;background:#f3e5f5;border:1px solid #ce93d8;border-radius:12px;align-items:center;">
        <div style="font-family:var(--display);font-size:.65rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#6a1b9a;">Total Owed to Contractors</div>
        <div style="font-size:1.4rem;font-weight:800;color:#6a1b9a;">$${totalOwed}</div>
        <div style="font-size:.8rem;color:#888;margin-left:auto;">${unpaid.length} unpaid job${unpaid.length !== 1 ? 's' : ''}</div>
      </div>`;

    const rows = jobs.map(j => {
      const d = j.scheduled_date
        ? new Date(j.scheduled_date + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
        : '—';
      const contractorName = cMap[j.contractor_id] || `#${j.contractor_id}`;
      const addr = (j.address || '').split(',')[0];
      return `<tr style="${!j.contractor_paid ? '' : 'opacity:.55;'}">
        <td style="font-weight:600;">${contractorName}</td>
        <td>${d}</td>
        <td style="font-size:.8rem;color:var(--text-mid);">${addr}</td>
        <td style="font-weight:700;color:#6a1b9a;">$${j.vendor_pay}</td>
        <td>${j.contractor_paid
          ? '<span style="color:var(--green);font-size:1.1rem;font-weight:700;">✓ Paid</span>'
          : `<button onclick="markContractorPaid(${j.id}, this)"
               style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:.35rem .8rem;background:#6a1b9a;color:#fff;border:none;border-radius:6px;cursor:pointer;">
               Mark Paid
             </button>`
        }</td>
      </tr>`;
    }).join('');

    document.getElementById('tableContainer').innerHTML = `
      <div style="padding:1rem 0;">
        ${summaryBar}
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:.85rem;">
            <thead>
              <tr style="border-bottom:2px solid var(--border);">
                <th style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-lite);padding:.6rem .75rem;text-align:left;">Contractor</th>
                <th style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-lite);padding:.6rem .75rem;text-align:left;">Service Date</th>
                <th style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-lite);padding:.6rem .75rem;text-align:left;">Address</th>
                <th style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-lite);padding:.6rem .75rem;text-align:left;">Amount</th>
                <th style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-lite);padding:.6rem .75rem;text-align:left;">Status</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  } catch(e) {
    document.getElementById('tableContainer').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-msg">Failed to load contractor payments</div></div>';
  }
}

async function markContractorPaid(leadId, btn) {
  btn.textContent = '...';
  btn.disabled = true;
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ contractor_paid: true })
    });
    // Update the row in place
    const td = btn.closest('td');
    td.innerHTML = '<span style="color:var(--green);font-size:1.1rem;font-weight:700;">✓ Paid</span>';
    btn.closest('tr').style.opacity = '.55';
    // Update summary bar total
    showPayContractors(document.getElementById('payContractorsTab'));
  } catch(e) {
    btn.textContent = 'Mark Paid';
    btn.disabled = false;
    alert('Failed to mark as paid. Please try again.');
  }
}

// ── Contractor Schedule View ──────────────────────────────────────────────
let cvContractorId  = null;
let cvAllJobs       = [];
let cvCurrentView   = 'week';
let cvViewDate      = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

function cvToISO(d) { return d.toISOString().split('T')[0]; }

async function showContractorSchedule(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tableTitle').textContent = 'Schedule View';
  document.getElementById('refreshBtn').onclick = () => showContractorSchedule(btn);

  let contractors = [];
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/contractors?status=eq.approved&select=id,name&order=name.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    contractors = await res.json();
  } catch(e) {}

  if (!contractors.length) {
    document.getElementById('tableContainer').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">👷</div><div class="empty-state-msg">No approved contractors yet</div></div>';
    return;
  }

  const options = contractors.map(c =>
    `<option value="${c.id}" ${cvContractorId == c.id ? 'selected' : ''}>${c.name}</option>`
  ).join('');

  document.getElementById('tableContainer').innerHTML = `
    <div style="padding:.75rem 0 2rem;">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap;">
        <label style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-mid);">Contractor</label>
        <select id="cvPicker" onchange="cvLoadContractor(this.value)"
          style="font-family:var(--body);font-size:.88rem;padding:.45rem .7rem;border:2px solid var(--border);border-radius:8px;background:#fff;color:var(--text);cursor:pointer;outline:none;">
          <option value="">— Select —</option>
          ${options}
        </select>
      </div>

      <!-- Schedule shell (hidden until contractor selected) -->
      <div id="cvShell" style="${cvContractorId ? '' : 'display:none;'}">
        <!-- Stats -->
        <div id="cvStats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem;"></div>

        <!-- View tabs + date nav -->
        <div style="display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;margin-bottom:.75rem;padding:.5rem .6rem;background:#f9fafb;border:1px solid var(--border);border-radius:12px;">
          <div style="display:flex;gap:.25rem;">
            ${['Day','Week','Month'].map(v => `
              <button id="cvTab${v}" onclick="cvSwitchView('${v.toLowerCase()}')"
                style="font-family:var(--display);font-size:.62rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:.35rem .75rem;border-radius:8px;border:none;cursor:pointer;transition:background .15s;background:${cvCurrentView===v.toLowerCase()?'var(--green)':'transparent'};color:${cvCurrentView===v.toLowerCase()?'#fff':'var(--text-mid)'};">
                ${v}
              </button>`).join('')}
          </div>
          <div style="display:flex;align-items:center;gap:.4rem;">
            <button onclick="cvNavigate(-1)" style="font-size:1.1rem;padding:.2rem .55rem;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;color:var(--text);">‹</button>
            <div style="text-align:center;min-width:140px;">
              <div id="cvNavLabel" style="font-family:var(--display);font-size:.75rem;font-weight:700;color:var(--text);letter-spacing:.3px;">—</div>
              <div id="cvNavSub" style="font-family:var(--display);font-size:.55rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-lite);">—</div>
            </div>
            <button onclick="cvNavigate(0)" style="font-family:var(--display);font-size:.6rem;font-weight:700;letter-spacing:.5px;padding:.3rem .65rem;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;color:var(--text);">Today</button>
            <button onclick="cvNavigate(1)" style="font-size:1.1rem;padding:.2rem .55rem;border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;color:var(--text);">›</button>
          </div>
        </div>

        <div id="cvScheduleWrap"></div>
      </div>
    </div>`;

  if (cvContractorId) cvLoadContractor(cvContractorId);
}

async function cvLoadContractor(cid) {
  cvContractorId = cid;
  const shell = document.getElementById('cvShell');
  if (!shell) return;
  if (!cid) { shell.style.display = 'none'; return; }
  shell.style.display = '';

  document.getElementById('cvScheduleWrap').innerHTML =
    '<div class="loading-state"><span class="spinner"></span> Loading...</div>';

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/leads?contractor_id=eq.${cid}&select=id,address,scheduled_date,scheduled_time,frequency,job_notes,status,name,photo_url,lot_size,vendor_pay,contractor_paid&order=scheduled_date.asc.nullslast`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } }
    );
    let jobs = await res.json();
    if (!Array.isArray(jobs)) jobs = [];
    jobs = jobs.filter(j => j.status !== 'cancelled' && j.status !== 'payment_failed');
    cvAllJobs = jobs;

    // Stats
    const todayStr = cvToISO(new Date());
    const DONE = ['completed','paid','invoiced'];
    const counts = [
      ['Today',     jobs.filter(j => j.scheduled_date === todayStr && !DONE.includes(j.status)).length, '#e8f5e9','#1b5e20'],
      ['Upcoming',  jobs.filter(j => j.scheduled_date > todayStr  && !DONE.includes(j.status)).length, '#fff8e1','#f57f17'],
      ['Total',     jobs.length, '#f3f4f6','#374151'],
      ['Completed', jobs.filter(j => DONE.includes(j.status)).length, '#f0fdf4','#166534'],
    ];
    document.getElementById('cvStats').innerHTML = counts.map(([label, val, bg, color]) =>
      `<div style="background:${bg};border-radius:10px;padding:.6rem;text-align:center;">
        <div style="font-size:1.4rem;font-weight:800;color:${color};">${val}</div>
        <div style="font-family:var(--display);font-size:.55rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:${color};opacity:.8;margin-top:.1rem;">${label}</div>
      </div>`
    ).join('');

    cvRenderSchedule();
  } catch(e) {
    document.getElementById('cvScheduleWrap').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-msg">Failed to load schedule</div></div>';
  }
}

function cvSwitchView(v) {
  cvCurrentView = v;
  ['day','week','month'].forEach(t => {
    const tab = document.getElementById('cvTab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (tab) {
      tab.style.background = t === v ? 'var(--green)' : 'transparent';
      tab.style.color      = t === v ? '#fff' : 'var(--text-mid)';
    }
  });
  cvRenderSchedule();
}

function cvNavigate(dir) {
  if (dir === 0) { cvViewDate = new Date(); cvViewDate.setHours(0,0,0,0); }
  else if (cvCurrentView === 'day')   { cvViewDate.setDate(cvViewDate.getDate() + dir); }
  else if (cvCurrentView === 'week')  { cvViewDate.setDate(cvViewDate.getDate() + dir * 7); }
  else if (cvCurrentView === 'month') { cvViewDate.setMonth(cvViewDate.getMonth() + dir); }
  cvRenderSchedule();
}

function cvRenderSchedule() {
  if (cvCurrentView === 'day')        cvRenderDayView();
  else if (cvCurrentView === 'week')  cvRenderWeekView();
  else                                cvRenderMonthView();
}

function cvRenderWeekView() {
  const d = new Date(cvViewDate);
  const dow = d.getDay();
  d.setDate(d.getDate() - ((dow + 6) % 7));
  const monday = new Date(d);

  const days = Array.from({length:8}, (_,i) => {
    const day = new Date(monday); day.setDate(monday.getDate()+i); return day;
  });
  const weekLabel = days[0].toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' – ' +
    days[7].toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  document.getElementById('cvNavLabel').textContent = weekLabel;
  document.getElementById('cvNavSub').textContent   = 'WEEK VIEW';

  const todayStr  = cvToISO(new Date());
  const dayNames  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun','Mon →'];
  const DONE      = ['completed','paid','invoiced'];

  let html = '<div style="overflow-x:auto;"><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:.35rem;min-width:560px;padding:.25rem 0 1.5rem;">';
  days.forEach((day, i) => {
    const ds       = cvToISO(day);
    const dayJobs  = cvAllJobs.filter(j => j.scheduled_date === ds);
    const isToday  = ds === todayStr;
    const isNext   = i === 7;
    html += `<div style="${isNext ? 'border-left:2px dashed var(--border);padding-left:.35rem;' : ''}">
      <div style="text-align:center;margin-bottom:.35rem;">
        <div style="font-family:var(--display);font-size:.55rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:${isNext?'var(--text-lite)':'var(--text-mid)'};">${dayNames[i]}</div>
        <div style="font-family:var(--display);font-size:.88rem;font-weight:700;color:var(--dark);width:24px;height:24px;line-height:24px;border-radius:50%;margin:.2rem auto 0;text-align:center;${isToday?'background:var(--green);color:#fff;':''}">${day.getDate()}</div>
      </div>
      <div style="min-height:70px;">`;
    if (dayJobs.length) {
      dayJobs.forEach(j => {
        const done = DONE.includes(j.status);
        const addr = (j.address||'').split(',')[0];
        html += `<span onclick="cvViewDate=new Date('${ds}T12:00:00');cvSwitchView('day')" title="${j.address||''}"
          style="display:block;background:${done?'#f5f5f5':'#FBF8F1'};border:1px solid ${done?'#e0e0e0':'rgba(228,216,197,.9)'};border-radius:8px;padding:.22rem .4rem;font-size:.63rem;font-family:var(--display);font-weight:600;color:${done?'#999':'var(--dark)'};margin-bottom:.2rem;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;">
          ${j.scheduled_time ? j.scheduled_time.substring(0,5)+' ' : ''}${addr}
        </span>`;
      });
    } else {
      html += `<div style="font-size:.62rem;color:var(--text-lite);text-align:center;padding:.5rem 0;">—</div>`;
    }
    html += `</div></div>`;
  });
  html += '</div></div>';
  document.getElementById('cvScheduleWrap').innerHTML = html;
}

function cvRenderDayView() {
  const dateStr  = cvToISO(cvViewDate);
  const dayName  = cvViewDate.toLocaleDateString('en-US',{weekday:'long'});
  const dateLong = cvViewDate.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const isToday  = dateStr === cvToISO(new Date());
  const DONE     = ['completed','paid','invoiced'];

  document.getElementById('cvNavLabel').textContent = dateLong;
  document.getElementById('cvNavSub').textContent   = (isToday ? 'TODAY · ' : '') + dayName.toUpperCase();

  const dayJobs = cvAllJobs.filter(j => j.scheduled_date === dateStr);
  const unscheduled = isToday ? cvAllJobs.filter(j => !j.scheduled_date && !DONE.includes(j.status)) : [];

  if (!dayJobs.length && !unscheduled.length) {
    document.getElementById('cvScheduleWrap').innerHTML =
      '<div class="empty-state"><div class="empty-state-icon">📅</div><div class="empty-state-msg">No jobs on this day</div></div>';
    return;
  }

  const rows = [...dayJobs, ...unscheduled];
  let html = '';
  rows.forEach(job => { html += cvRenderJobCard(job); });
  document.getElementById('cvScheduleWrap').innerHTML = html;
}

function cvRenderMonthView() {
  const year  = cvViewDate.getFullYear();
  const month = cvViewDate.getMonth();
  const label = cvViewDate.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  document.getElementById('cvNavLabel').textContent = label;
  document.getElementById('cvNavSub').textContent   = 'MONTH VIEW';

  const todayStr   = cvToISO(new Date());
  const firstDay   = new Date(year, month, 1);
  const lastDay    = new Date(year, month+1, 0);
  const startOff   = (firstDay.getDay() + 6) % 7;
  const totalCells = Math.ceil((startOff + lastDay.getDate()) / 7) * 7;
  const dayNames   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  let html = '<div style="overflow-x:auto;"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;min-width:420px;padding-bottom:1.5rem;">';
  dayNames.forEach(n => {
    html += `<div style="font-family:var(--display);font-size:.55rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text-lite);text-align:center;padding:.3rem 0;">${n}</div>`;
  });
  for (let i = 0; i < totalCells; i++) {
    const cellDate = new Date(year, month, 1 - startOff + i);
    const ds       = cvToISO(cellDate);
    const inMonth  = cellDate.getMonth() === month;
    const isToday  = ds === todayStr;
    const dayJobs  = cvAllJobs.filter(j => j.scheduled_date === ds);
    const dots     = Math.min(dayJobs.length, 3);
    html += `<div onclick="cvViewDate=new Date('${ds}T12:00:00');cvSwitchView('day')" style="min-height:52px;border:1px solid var(--border);border-radius:8px;padding:.3rem .4rem;cursor:pointer;background:${isToday?'#f0fdf4':inMonth?'#fff':'#fafafa'};opacity:${inMonth?1:.45};">
      <div style="font-family:var(--display);font-size:.7rem;font-weight:700;color:${isToday?'var(--green)':'var(--text)'};${isToday?'':''}margin-bottom:.2rem;">${cellDate.getDate()}</div>
      ${dayJobs.length ? `<div style="display:flex;gap:2px;flex-wrap:wrap;">${Array.from({length:dots}).map(()=>`<div style="width:6px;height:6px;border-radius:50%;background:var(--green);"></div>`).join('')}${dayJobs.length>3?`<span style="font-size:.55rem;color:var(--green);font-weight:700;">+${dayJobs.length-3}</span>`:''}</div>` : ''}
    </div>`;
  }
  html += '</div></div>';
  document.getElementById('cvScheduleWrap').innerHTML = html;
}

function cvRenderJobCard(job) {
  const DONE     = ['completed','paid','invoiced'];
  const isDone   = DONE.includes(job.status);
  const todayStr = cvToISO(new Date());

  const dateStr  = job.scheduled_date
    ? new Date(job.scheduled_date+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})
    : 'Not scheduled yet';
  const freqLabel = job.frequency==='weekly'?'Weekly':job.frequency==='twice'?'Twice a Month':'One Time';

  let badgeColor='#d97706', badgeLabel='🟡 Upcoming';
  if (isDone)                              { badgeColor='#16a34a'; badgeLabel='✓ Done'; }
  else if (job.scheduled_date===todayStr)  { badgeColor='#16a34a'; badgeLabel='🟢 Today'; }
  else if (!job.scheduled_date)            { badgeColor='#9ca3af'; badgeLabel='⏳ Unscheduled'; }

  let notesHtml = '';
  if (job.job_notes) {
    const hideRe = /week ago|weeks ago|\bnone\b/i;
    const chips  = job.job_notes.split(' | ').map(s=>s.trim()).filter(p=>p&&!hideRe.test(p))
      .map(p=>`<span style="display:inline-block;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;padding:.18rem .5rem;font-size:.7rem;color:#374151;margin:.12rem .18rem 0 0;">${p}</span>`);
    if (chips.length) notesHtml = `<div style="margin-bottom:.5rem;">${chips.join('')}</div>`;
  }

  const statusLabel = {rescheduled:'Rescheduled',completed:'Completed',paid:'Paid',invoiced:'Invoiced',booked:'Booked',started:'Started'}[job.status]||job.status;
  const statusColor = (isDone||job.status==='rescheduled') ? '#16a34a' : '#6b7280';

  return `<div style="background:#fff;border:1px solid var(--border);border-radius:14px;padding:.9rem 1rem;margin-bottom:.65rem;${isDone?'opacity:.65;':''}">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.5rem;gap:.5rem;flex-wrap:wrap;">
      <div style="font-weight:700;font-size:.92rem;color:var(--text);">${job.address||'—'}</div>
      <span style="font-family:var(--display);font-size:.6rem;font-weight:700;background:${badgeColor}18;color:${badgeColor};border:1px solid ${badgeColor}40;border-radius:100px;padding:.2rem .65rem;white-space:nowrap;">${badgeLabel}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.35rem .65rem;margin-bottom:.5rem;">

function exportCSV() {
  if (!allLeads.length) return;
  const headers = ['Date','Name','Email','Phone','Address','Zip','Frequency','Price','Status'];
  const rows = allLeads.map(l => [
    l.created_at ? new Date(l.created_at).toLocaleDateString() : '',
    l.name || '', l.email || '', l.phone || '',
    l.address || '', l.zip || '', l.frequency || '',
    l.price || '', l.status || ''
  ].map(v => `"${v}"`).join(','));

  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tdr-leads-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

function adminPreviewPhoto() {
  const input = document.getElementById('adminPhotoInput');
  const preview = document.getElementById('adminPhotoPreview');
  const btn = document.getElementById('adminSubmitBtn');
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    btn.style.display = 'block';
  };
  reader.readAsDataURL(input.files[0]);
}

async function adminSubmitPhoto(leadId) {
  const input = document.getElementById('adminPhotoInput');
  const btn   = document.getElementById('adminSubmitBtn');
  const msg   = document.getElementById('adminPhotoMsg');
  if (!input.files || !input.files[0]) return;

  btn.textContent = 'Uploading...';
  btn.disabled = true;
  msg.style.display = 'none';

  try {
    const file = input.files[0];
    const filename = `job-${leadId}-${Date.now()}.${file.name.split('.').pop()}`;

    // 1. Upload photo to Supabase Storage via REST API
    const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/job-photos/${filename}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': file.type
      },
      body: file
    });
    if (!uploadRes.ok) throw new Error('Photo upload failed');

    const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/job-photos/${filename}`;

    // 2. Mark job completed with photo URL
    btn.textContent = 'Saving...';
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ status: 'completed', photo_url: publicUrl })
    });

    // 3. Send invoice & charge client
    btn.textContent = 'Charging client...';
    const invoiceRes = await fetch('https://djigwfatupycyfozivuu.supabase.co/functions/v1/send-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lead_id: leadId })
    });
    if (!invoiceRes.ok) throw new Error('Invoice failed');

    // Update local cache
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) { lead.status = 'completed'; lead.photo_url = publicUrl; }

    // 4. Schedule next visit for recurring clients (background)
    adminScheduleNextVisit(leadId);

    msg.textContent = '✓ Job submitted and client charged';
    msg.style.color = 'var(--green)';
    msg.style.display = 'block';
    btn.textContent = '✅ Done';
  } catch(e) {
    console.error('Admin submit photo error:', e);
    msg.textContent = 'Error: ' + e.message;
    msg.style.color = '#c62828';
    msg.style.display = 'block';
    btn.textContent = '✅ Submit & Charge Client';
    btn.disabled = false;
  }
}

async function adminScheduleNextVisit(leadId) {
  try {
    const job = allLeads.find(l => l.id === leadId);
    if (!job || !job.scheduled_date) return;
    if (job.frequency !== 'weekly' && job.frequency !== 'twice') return;
    const days = job.frequency === 'weekly' ? 7 : 14;
    const next = new Date(job.scheduled_date + 'T12:00:00');
    next.setDate(next.getDate() + days);
    const nextDateStr = next.toISOString().split('T')[0];
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ scheduled_date: nextDateStr, status: 'rescheduled' })
    });
  } catch(e) {
    console.error('Admin schedule next visit error:', e);
  }
}

async function saveJobNotes(leadId) {
  const textarea = document.getElementById('jobNotesInput');
  const msg      = document.getElementById('jobNotesMsg');
  const val      = textarea.value.trim();
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ job_notes: val })
    });
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.job_notes = val;
    msg.style.display = 'block';
    msg.style.color = 'var(--green)';
    msg.textContent = '✓ Notes saved';
    setTimeout(() => { msg.style.display = 'none'; }, 2500);
  } catch(e) {
    msg.style.display = 'block';
    msg.style.color = '#c62828';
    msg.textContent = 'Failed to save. Please try again.';
  }
}

async function saveVendorPay(leadId) {
  const input = document.getElementById('vendorPayInput');
  const msg   = document.getElementById('vendorPayMsg');
  const val   = parseFloat(input.value);

  if (isNaN(val) || val < 0) {
    msg.textContent = 'Please enter a valid amount.';
    msg.style.color = '#c62828';
    msg.style.display = 'block';
    return;
  }

  msg.textContent = 'Saving...';
  msg.style.color = 'var(--text-mid)';
  msg.style.display = 'block';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ vendor_pay: val })
    });
    if (!res.ok) throw new Error('Failed');
    // Update local cache so drawer reopens with correct value
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.vendor_pay = val;
    msg.textContent = '✓ Saved';
    msg.style.color = 'var(--green)';
  } catch {
    msg.textContent = 'Error saving. Please try again.';
    msg.style.color = '#c62828';
  }
}

async function togglePromo(leadId, checked) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ first_mow_promo: checked })
    });
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.first_mow_promo = checked;
    renderTable();
  } catch(e) {
    console.error('Toggle promo error:', e);
  }
}

async function saveClientPrice(leadId) {
  const input = document.getElementById('clientPriceInput');
  const msg   = document.getElementById('clientPriceMsg');
  const val   = parseFloat(input.value);

  if (isNaN(val) || val < 0) {
    msg.textContent = 'Please enter a valid price.';
    msg.style.color = '#c62828';
    msg.style.display = 'block';
    return;
  }

  msg.textContent = 'Saving...';
  msg.style.color = '#888';
  msg.style.display = 'block';

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ price: val })
    });
    if (!res.ok) throw new Error('Failed');
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.price = val;
    msg.textContent = '✓ Price saved';
    msg.style.color = 'var(--green)';
  } catch {
    msg.textContent = 'Error saving. Please try again.';
    msg.style.color = '#c62828';
  }
}

async function applyFirstMowPromo(leadId) {
  const btn = document.getElementById('applyPromoBtn');
  btn.disabled = true;
  btn.textContent = 'Applying...';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ first_mow_promo: true })
    });
    if (!res.ok) throw new Error('Failed');
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.first_mow_promo = true;
    btn.textContent = '✅ Promo applied!';
    setTimeout(() => openLeadDrawer(leadId), 800);
  } catch {
    btn.textContent = 'Error — try again';
    btn.disabled = false;
  }
}

async function markFirstMowDone(leadId) {
  const btn = document.getElementById('firstMowDoneBtn');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${leadId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, Prefer: 'return=minimal' },
      body: JSON.stringify({ first_mow_promo: false })
    });
    if (!res.ok) throw new Error('Failed');
    const lead = allLeads.find(l => l.id === leadId);
    if (lead) lead.first_mow_promo = false;
    btn.textContent = '✅ Done — reverted to regular rate';
    btn.style.background = '#6b7280';
    setTimeout(() => openLeadDrawer(leadId), 800);
  } catch {
    btn.textContent = 'Error — try again';
    btn.disabled = false;
  }
}

function closeLeadDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('leadDrawer').classList.remove('open');
}
</script>

<!-- LEAD DETAIL DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeLeadDrawer()"></div>
<div class="lead-drawer" id="leadDrawer">
  <div class="drawer-header">
    <span class="drawer-title">Client Details</span>
    <button class="drawer-close" onclick="closeLeadDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerContent"></div>
</div>

</body>
</html>
